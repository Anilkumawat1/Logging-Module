spring:
  application:
    name: logging-demo

app:
  logging:
    service-name: logging-demo
    environment: local
    format: json
    include:
      request-headers: true
      response-headers: true
      request-parameters: true
      response-payload: true
    operations:
      mappings:
        "POST /api/orders": CREATE_ORDER
    payload:
      request-max-size: 10000
      response-max-size: 10000
      log-binary: false
    request-payload:
      on-status-ranges:
        - "200-599"
