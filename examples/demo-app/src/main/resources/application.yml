spring:
  application:
    name: logging-demo

app:
  logging:
    enabled: true
    service-name: logging-demo
    environment: local
    format: json
    include:
      request-headers: true
      response-headers: true
      request-parameters: true
      request-payload: true
      response-payload: false
      user: true
      ip: true
      domain: true
      url: true
      operation: true
      trace: true
      thread: true
      logger: true
      caller: false
    operations:
      mappings:
        "POST /api/orders": CREATE_ORDER
    payload:
      request-max-size: 10000
      response-max-size: 10000
      log-binary: false
    request-payload:
      on-status-ranges:
        - "400-599"
    masking:
      enabled: true
      replacement: "***"
    async:
      enabled: true
      task-decorator: true
      executor-integration: true
